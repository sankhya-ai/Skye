[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skye"
version = "0.1.0"
description = "An autonomous engineering team in a box: Chamber coordination + your own coding agents, dispatched by plain code."
requires-python = ">=3.10"

[tool.setuptools]
packages = ["skye", "skye.adapters"]
