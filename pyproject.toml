[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skye"
version = "0.1.0"
description = "An autonomous engineering team in a box: Chamber coordination + your own coding agents, dispatched by plain code."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
skye = "skye.cli:main"

# Pure-stdlib package (verified: skye/ imports nothing third-party); every subpackage is
# listed explicitly so a wheel install carries the UI server and adapters, not just the core.
[tool.setuptools]
packages = ["skye", "skye.adapters", "skye.ui"]

# The built web bundle the UI server serves (skye/ui/dist) and its attribution NOTICE are
# data, not code: without this a wheel install has a server with no screens.
[tool.setuptools.package-data]
"skye.ui" = ["dist/**/*", "NOTICE"]

# `pytest` from the repo root runs Skye's suite. The vendored Root tree carries its own test
# suite with its own dependencies; it is Root's to run, not collected here.
[tool.pytest.ini_options]
testpaths = ["tests"]
