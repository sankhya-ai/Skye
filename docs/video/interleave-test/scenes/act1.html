<!doctype html>
<html><head><meta charset="utf-8"><title>Storyboard: The Setup</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#b8c5f2}
#card{position:absolute;left:90px;right:90px;top:640px;height:640px;background:#fdfbf7;border-radius:36px;box-shadow:0 30px 80px rgba(40,40,80,.25)}
#t{position:absolute;left:0;right:0;top:120px;text-align:center;font:700 96px/1.15 'DejaVu Sans',sans-serif;color:#3a3f66}
#s{position:absolute;left:0;right:0;top:330px;text-align:center;font:400 44px/1.3 'DejaVu Sans',sans-serif;color:#6a6f99}
#bar{position:absolute;left:120px;right:120px;top:500px;height:18px;border-radius:9px;background:#e3e0f5;overflow:hidden}
#fill{height:100%;width:0;background:#7f8ff2}
</style></head>
<body><div id="card"></div><div id="t">THE SETUP</div><div id="s">storyboard frame drawn by code</div><div id="bar"><div id="fill"></div></div>
<script>
const fill=document.getElementById('fill'),card=document.getElementById('card');
window.film={duration:2,frame(t){
  card.style.transform='translateY('+Math.max(0,40-80*t)+'px)';
  card.style.opacity=String(Math.min(1,t*3));
  fill.style.width=(Math.min(1,t/2)*100)+'%';
}};
</script></body></html>
