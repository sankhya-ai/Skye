<!doctype html><html><head><meta charset="utf-8"><style>*{margin:0}html,body{width:100%;height:100%;overflow:hidden;background:#111}canvas{width:100%;height:100%;object-fit:contain}</style></head><body><canvas id="c" width="1280" height="720"></canvas><script>
const CONFIG={man:'',phone:'',screen:'',brand:'skye.'};
const c=document.getElementById('c'),g=c.getContext('2d'),W=1280,H=720,M='#aaffd8',R='#ed3449',P='#f3efe7';
const videos={};for(const key of ['man','phone']){const v=document.createElement('video');if(CONFIG[key])v.src=CONFIG[key];v.muted=true;v.preload='auto';v.playsInline=true;videos[key]=v;}const screen=new Image();if(CONFIG.screen)screen.src=CONFIG.screen;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=v=>1-Math.pow(1-clamp(v),3),lerp=(a,b,t)=>a+(b-a)*t;
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}
function txt(s,x,y,size=100,color=M,rot=0,scale=1,align='left',stroke=false){g.save();g.translate(x,y);g.rotate(rot);g.scale(scale,scale);g.font='900 '+size+'px Arial';g.textAlign=align;g.textBaseline='middle';g.fillStyle=color;g.strokeStyle=color;g.lineWidth=2;if(stroke)g.strokeText(s,0,0);else g.fillText(s,0,0);g.restore()}
function word(s,x,y,size,start,u,color=M,angle=0){const a=ease((u-start)/.32);g.save();g.globalAlpha=a;g.filter='blur('+((1-a)*13)+'px)';txt(s,x+(1-a)*170,y+(1-a)*50,size,color,angle-(1-a)*.18,1.18-.18*a);g.restore()}
function video(key,x=0,y=0,w=W,h=H,time=0,zoom=1,angle=0){const v=videos[key];if(v.readyState<2)return;g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.translate(x+w/2,y+h/2);g.rotate(angle);const z=Math.max(w/v.videoWidth,h/v.videoHeight)*zoom;g.drawImage(v,-v.videoWidth*z/2,-v.videoHeight*z/2,v.videoWidth*z,v.videoHeight*z);g.restore()}
function arc(s,x,y,r,start,span,size,color){g.save();g.translate(x,y);for(let i=0;i<s.length;i++){const a=start+span*i/Math.max(1,s.length-1);g.save();g.rotate(a);g.translate(0,-r);g.rotate(0);txt(s[i],0,0,size,color,0,1,'center');g.restore()}g.restore()}
function dash(u){g.strokeStyle='#ffffff35';g.lineWidth=1;g.strokeRect(28,28,W-56,H-56);for(let i=0;i<4;i++)txt(String(i+1).padStart(2,'0'),40+i*305,680,12,'#ffffff80');rect(38+u*120,52,70,3,M)}
function tiles(t){rect(0,0,W,H,'#101618');g.save();g.translate(640,360);g.rotate(-.17);for(let y=-2;y<3;y++)for(let x=-3;x<4;x++){const xx=x*230,yy=y*210+(t*95)%210;rect(xx,yy,216,196,['#3b5b52','#482f40','#273b56'][(x+y+9)%3]);txt(['CUT','PLAY','SAVE','GO'][((x-y)%4+4)%4],xx+18,yy+100,46,'#ffffff45');}g.restore()}
const cuts=[0,1.8,3.5,5.4,7.2,9.3,11.5,13.2,15.6,17.8,20];function cut(t){return Math.min(9,cuts.findIndex((v,i)=>i<10&&t>=v&&t<cuts[i+1]))}
async function seek(v,t){if(!v.getAttribute('src'))return;if(v.readyState<1)await new Promise((ok,no)=>{v.addEventListener('loadedmetadata',ok,{once:true});v.addEventListener('error',()=>no(Error('Import the Cut Rush media first')),{once:true})});t=clamp(t,0,v.duration-.05);if(Math.abs(v.currentTime-t)<.008&&v.readyState>=2)return;await new Promise((ok,no)=>{const timer=setTimeout(()=>no(Error('Video seek timeout')),8000);v.addEventListener('seeked',()=>{clearTimeout(timer);ok()},{once:true});v.currentTime=t;})}
window.film={duration:2,async frame(t){t=clamp(t,0,19.999);const n=cut(t),u=(t-cuts[n])*2/(cuts[n+1]-cuts[n]);await Promise.all([seek(videos.man,(t*.61)%9),seek(videos.phone,(t*.77)%9)]);if(CONFIG.screen&&!screen.complete)await screen.decode();g.resetTransform();g.filter='none';g.globalAlpha=1;rect(0,0,W,H,'#101514');g.save();const exit=ease((u-1.65)/.35);g.translate(-exit*110,exit*30);g.translate(640,360);g.scale(1+exit*.25,1+exit*.25);g.rotate(exit*-.045);g.translate(-640,-360);
// An actual whole-picture turn, not a font trick.
if(n===4){/* Scene 4 rotates footage independently of type below. */}
if(n===0){rect(0,0,W,H,P);g.save();g.translate(640,360);g.rotate(-.16);g.scale(1.4-u*.12,1.4-u*.12);for(let i=-3;i<5;i++)txt(i%2?'A THOUSAND CLIPS':'ONE GOOD STORY',-650+u*100,i*120,116,R);g.restore();video('man',840-150*ease(u/.6),130+Math.sin(u*2)*12,410,590,t,1.18,-.07);rect(30,590,680,94,'#111');word('WHERE TO START?',55,638,67,.35,u,P);}
if(n===1){video('phone',0,0,W,H,t,1.18+u*.06,.03);rect(0,0,W,H,'#0007');for(let i=0;i<7;i++){const x=100+i*175+Math.sin(t+i)*20,y=150+(i%3)*150-u*35;g.save();g.translate(x,y);g.rotate((i-3)*.07);rect(-65,-80,138,180,'#121c20e8');rect(-50,-60,108,5,M);for(let j=0;j<4;j++)rect(-50,-35+j*31,80+(j%2)*20,13,'#ffffff20');g.restore()}word('SAVE',100,230,170,0,u);word('IT.',650,405,240,.18,u);arc('FOR LATER',700,500,225,-1.1,2.2,52,P);}
if(n===2){tiles(t);rect(0,0,W,H,'#0004');video('man',440,95,410,550,t,1.3,-.04);word('LATER',60,145,155,0,u,R,-.08);word('BECOMES',590,540,100,.25,u,P,.08);word('NEVER.',65,625,140,.5,u,M,-.04);arc('ANOTHER TAB',655,400,300,-1.2,2.4,45,M);}
if(n===3){video('man',0,0,W,H,t,1.35+u*.1);rect(0,0,W,H,'#071b1b88');word('THE',80,190,110,0,u,P,-.1);word('CLOCK',120,340,185,.15,u,M,-.04);word('KEEPS',710,430,100,.4,u,P,.1);word('MOVING.',560,575,150,.6,u,M,.05);g.strokeStyle=R;g.lineWidth=6;g.beginPath();g.arc(1040,180,95,-Math.PI/2,-Math.PI/2+u*4);g.stroke();}
if(n===4){g.save();g.translate(640,360);g.rotate(Math.PI*ease(u/.45));g.translate(-640,-360);video('man',0,0,W,H,t,1.25+u*.08);g.restore();rect(0,0,W,H,'#001a1955');txt('FLIP THE',640,200,140,P,0,1,'center');txt('SCRIPT.',640,445,220,M,0,1,'center');word('not your whole day.',50,645,47,.4,u,P);}
if(n===5){tiles(t);g.save();g.translate(640,360);g.rotate(Math.sin(u*2)*.06);g.scale(.82+ease(u/.5)*.25,.82+ease(u/.5)*.25);if(screen.complete&&screen.naturalWidth)g.drawImage(screen,-480,-280,960,560);g.restore();word('CUT',45,150,180,0,u,M,-.12);word('THE',910,355,115,.22,u,R,.12);word('CHAOS.',470,620,160,.45,u,M,-.05);}
if(n===6){video('man',0,0,640,H,t,1.17+u*.06,-.025);video('phone',640,0,640,H,t,1.2+u*.04,.025);rect(0,0,W,H,'#0004');rect(630,0,20,H,M);arc('SHOOT / CUT / REPEAT',640,410,270,-1.45,2.9,49,M);word('LESS',65,565,135,0,u,P,-.1);word('SCRUBBING.',540,650,104,.3,u,M,.03);}
if(n===7){rect(0,0,W,H,P);g.save();g.translate(640,360);g.rotate(-.08+u*.03);for(let i=-2;i<4;i++)txt('MAKE SOMETHING',-710+u*60,i*160,156,i===1?R:'#ed344930');g.restore();video('man',570+u*22,130,350,460,t,1.2,-.13+u*.03);video('phone',860-u*80,70,340,570,t,1.1,.12-u*.06);word('worth watching.',70,625,72,.25,u,'#111');}
if(n===8){video('man',0,0,W,H,t,1.15);rect(0,0,W,H,'#07181299');arc('YOUR SHOTS',640,370,255,-1.25,2.5,62,M);word('YOUR',80,390,170,.1,u,P,-.06);word('STORY.',520,580,180,.3,u,M,.04);txt('01 / PICK',80,80,23,P);txt('02 / CUT',560,80,23,P);txt('03 / PLAY',1040,80,23,P);}
if(n===9){tiles(t*.5);rect(0,0,W,H,'#081310cc');g.save();g.translate(640,350);g.rotate(-.035*Math.exp(-u*3));const z=1+.25*Math.exp(-u*5);txt(CONFIG.brand,0,0,235,M,0,z,'center');g.restore();word('MAKE YOUR NEXT CUT.',300,565,49,.3,u,P);arc('SHOOT / CUT / PLAY',640,360,305,-1.4,2.8,27,M);}
g.restore();
// Deterministic block interruption around cuts, then a two-frame negative.
const transition=u<.14?1-u/.14:u>1.9?(u-1.9)/.1:0;if(transition>0){for(let i=0;i<58;i++){const seed=(i*71+n*139)%997;if(seed/997<transition*.8)rect((i*173)%W,((i*97)%H),80+(i%4)*35,30+(i%3)*50,i%3?M:R)}}
if((n===2||n===5||n===8)&&u>.17&&u<.237){g.save();g.globalCompositeOperation='difference';rect(0,0,W,H,'white');g.restore()}
dash(u);g.save();g.globalAlpha=.045;for(let i=0;i<130;i++){const k=(i*73+Math.floor(t*30)*91)%W;rect(k,(i*47+Math.floor(t*30)*37)%H,2,2,'white')}g.restore();}};
</script></body></html>
