const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x03050d,0);document.body.prepend(renderer.domElement);const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.z=10;const sample=sampleTextToPoints('SKYE',{worldWidth:3.65,step:2,fontSize:200,fontFamily:'Arial',fontWeight:900});const count=sample.count,live=new Float32Array(count*3),sphere=new Float32Array(count*3),colors=new Float32Array(count*3),seeds=new Float32Array(count);for(let i=0;i<count;i++){const a=i*2.39996323,y=1-2*(i+.5)/count,r=Math.sqrt(1-y*y),j=i*3;sphere[j]=r*Math.cos(a)*1.7;sphere[j+1]=y*1.7;sphere[j+2]=r*Math.sin(a)*1.7;seeds[i]=((i*1297)%10007)/10007;const c=new THREE.Color().setHSL(.54+.13*seeds[i],.9,.5+.3*seeds[i]);colors.set([c.r,c.g,c.b],j);}const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(live,3));geometry.setAttribute('color',new THREE.BufferAttribute(colors,3));const material=new THREE.ShaderMaterial({uniforms:{pixelScale:{value:innerWidth/360}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,vertexShader:'uniform float pixelScale;attribute vec3 color; varying vec3 c; void main(){c=color; vec4 p=modelViewMatrix*vec4(position,1.);gl_PointSize=clamp(42./-p.z,1.4,5.)*pixelScale;gl_Position=projectionMatrix*p;}',fragmentShader:'precision highp float;varying vec3 c;void main(){float d=length(gl_PointCoord-.5);float a=exp(-d*d*25.);gl_FragColor=vec4(c,a*.65);}'});const points=new THREE.Points(geometry,material);points.position.y=.5;scene.add(points);const haloGeo=new THREE.BufferGeometry(),halo=new Float32Array(600*3);for(let i=0;i<600;i++){const a=i*2.39996,r=2+(i%97)/35;halo.set([Math.cos(a)*r,Math.sin(a)*r,((i*13)%67)/12-3],i*3);}haloGeo.setAttribute('position',new THREE.BufferAttribute(halo,3));const stars=new THREE.Points(haloGeo,new THREE.PointsMaterial({color:0x6376a4,size:.013,transparent:true,opacity:.55}));scene.add(stars);
window.film={duration:2,frame(t){const u=Math.max(0,Math.min(1,(t-.4)/1.5)),m=u*u*(3-2*u),a=t*.5*(1-m),cs=Math.cos(a),sn=Math.sin(a);for(let i=0;i<count;i++){const j=i*3,x=sphere[j]*cs+sphere[j+2]*sn,z=-sphere[j]*sn+sphere[j+2]*cs;live[j]=x*(1-m)+sample.positions[j]*m;live[j+1]=sphere[j+1]*(1-m)+sample.positions[j+1]*m;live[j+2]=z*(1-m)+sample.positions[j+2]*m;}geometry.attributes.position.needsUpdate=true;stars.rotation.z=t*.025;renderer.render(scene,camera);}};window.film.frame(0);
