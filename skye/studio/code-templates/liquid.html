<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050710;color:white;font-family:Arial}canvas{position:absolute;inset:0;width:100%;height:100%}main{position:absolute;left:8%;right:8%;top:34%;font-size:15vw;font-weight:800;letter-spacing:-.075em;line-height:.92;text-shadow:0 2px 35px #02031760}small{position:absolute;left:8%;top:10%;font-size:2.6vw;letter-spacing:.3em;color:#d6d9ff}footer{position:absolute;left:8%;bottom:9%;font-size:3.3vw;line-height:1.5;max-width:70%;color:#d5d9ed}</style></head><body><canvas></canvas><small>STUDIO / PROCEDURAL MATTER</small><main>Form.<br>In motion.</main><footer>Light, colour and code.<br>No cameras required.</footer><script>
// Shader adapted from CrazyGL-com/hero-liquid-aurora-gradient, Apache-2.0.
// Local deterministic renderer, new typography and violet palette by Skye.
const VERT="#version 300 es\nin vec2 a_position;\nvoid main() { gl_Position = vec4(a_position, 0.0, 1.0); }",FRAG="#version 300 es\nprecision highp float;\nout vec4 outColor;\n\n// Coordinate spaces:\n//   fragCoord \u2014 pixel coords [0..res.x] x [0..res.y]\n//   texUV     \u2014 [0..1] x [0..1], origin bottom-left\n//   coverUV   \u2014 aspect-corrected texUV (object-fit: cover, no stretch)\n//   p         \u2014 noise-domain coords (coverUV * u_scale)\n//   u_input   \u2014 pointer 0..1, top-left origin (Y FLIPPED vs texUV)\n\nuniform vec2  u_resolution;\nuniform float u_time;\nuniform vec2  u_input;          // pointer 0..1, top-left origin\nuniform float u_inputActive;\n\nuniform vec3  u_colorBase;      // near-black\nuniform vec3  u_colorDeep;      // deep navy\nuniform vec3  u_colorA;         // electric blue\nuniform vec3  u_colorB;         // orange\nuniform vec3  u_colorHot;       // hot highlight\n\nuniform float u_flowSpeed;\nuniform float u_warpAmount;\nuniform float u_scale;\nuniform float u_contrast;\nuniform float u_pointerWarp;\nuniform vec2  u_pointerVel;      // smoothed cursor velocity (0..1/frame, top-left)\nuniform float u_transparent;\n\n// \u2500\u2500 Multi-step non-linear hash \u2192 smooth value noise \u2192 FBM \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// Hash (skill catalog). NO fract(sin(x*BIG)); no time term inside the hash.\nfloat hash21(vec2 p) {\n\tp = fract(p * vec2(123.34, 456.21));\n\tp += dot(p, p + 45.32);\n\treturn fract(p.x * p.y);\n}\n\n// Value noise with a quintic fade (iq) \u2014 C2 continuous, so the FBM has no\n// grid creases that would show up as banding in the soft low frequencies.\nfloat vnoise(vec2 p) {\n\tvec2 i = floor(p);\n\tvec2 f = fract(p);\n\tvec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);   // 6t^5-15t^4+10t^3\n\tfloat a = hash21(i + vec2(0.0, 0.0));\n\tfloat b = hash21(i + vec2(1.0, 0.0));\n\tfloat c = hash21(i + vec2(0.0, 1.0));\n\tfloat d = hash21(i + vec2(1.0, 1.0));\n\treturn mix(mix(a, b, u.x), mix(c, d, u.x), u.y);\n}\n\n// FBM \u2014 4 octaves. Rotate the domain each octave (iq) so the lattice axes of\n// successive octaves don't align and reinforce into visible square structure.\nconst mat2 ROT = mat2(0.80, 0.60, -0.60, 0.80);\nfloat fbm(vec2 p) {\n\tfloat v = 0.0;\n\tfloat a = 0.5;\n\tfor (int i = 0; i < 4; i++) {\n\t\tv += a * vnoise(p);\n\t\tp = ROT * p * 2.02 + 11.5;\n\t\ta *= 0.5;\n\t}\n\treturn v;                 // ~[0,1], soft\n}\n\nvoid main() {\n\tvec2 res = u_resolution;\n\tvec2 texUV = gl_FragCoord.xy / res;          // [0..1], origin bottom-left\n\n\t// Cover-fit: scale the SHORT axis so the noise domain keeps a fixed aspect\n\t// and fills the canvas (CSS object-fit: cover) \u2014 the blobs never stretch\n\t// when the hero is resized wide or tall.\n\tfloat aspect = res.x / max(res.y, 1.0);\n\tvec2 coverUV = (texUV - 0.5);\n\tif (aspect > 1.0) coverUV.x *= aspect;       // wide: extend domain in x\n\telse              coverUV.y /= max(aspect, 1e-4);\n\n\tvec2 p = coverUV * (1.45 * u_scale);         // noise-domain coords (low freq \u2192 big blobs)\n\n\t// Slow time evolution. flowSpeed scales the drift; a small base drift keeps\n\t// some life even at low speeds.\n\tfloat t = u_time * (0.06 * u_flowSpeed);\n\n\t// Pointer DRAG: the fluid is pulled in the direction the cursor MOVES \u2014 a\n\t// viscous wake \u2014 rather than contracted radially toward it (which read as a\n\t// magnifier). u_input is top-left origin; texUV is bottom-left \u2192 flip Y.\n\tvec2 ptr = vec2(u_input.x, 1.0 - u_input.y);  // cursor in texUV space\n\tvec2 ptrC = (ptr - 0.5);\n\tif (aspect > 1.0) ptrC.x *= aspect; else ptrC.y /= max(aspect, 1e-4);\n\tptrC *= (1.45 * u_scale);\n\tfloat pd = length(ptrC - p);\n\t// Soft local region around the cursor; falloff scaled by domain scale so the\n\t// wake stays a consistent on-screen size regardless of the scale slider.\n\tfloat pg = exp(-pd * pd / (0.55 * u_scale * 0.55 * u_scale));\n\t// Cursor velocity in the same domain space (Y flipped to match texUV).\n\tvec2 velC = vec2(u_pointerVel.x, -u_pointerVel.y);\n\tif (aspect > 1.0) velC.x *= aspect; else velC.y /= max(aspect, 1e-4);\n\tvelC *= (1.45 * u_scale);\n\t// Sample UPSTREAM of the motion so the pattern trails the cursor (drag).\n\tp -= velC * pg * u_pointerWarp * u_inputActive;\n\n\t// \u2500\u2500 Domain warping (iq) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\t// q displaces the input along two FBM channels sampled at offset points;\n\t// r warps again using q; the final field f reads the twice-folded domain.\n\tfloat w = u_warpAmount;\n\tvec2 q = vec2(\n\t\tfbm(p + vec2(0.0, 0.0) + t),\n\t\tfbm(p + vec2(5.2, 1.3) - t)\n\t);\n\tvec2 r = vec2(\n\t\tfbm(p + w * q + vec2(1.7, 9.2) + 0.15 * t),\n\t\tfbm(p + w * q + vec2(8.3, 2.8) - 0.12 * t)\n\t);\n\tfloat f = fbm(p + w * r);                     // primary density field, ~[0,1]\n\n\t// A SECOND, independently-warped field decides blue-vs-orange. Sampled at a\n\t// LOWER spatial frequency (x0.55) so warm and cool form a few LARGE regions\n\t// that sit side-by-side and bleed (the reference is two big masses, not a\n\t// fine warm/cool speckle). Decorrelated from f via its own domain offset/time.\n\tfloat hueField = fbm(p * 0.55 + w * r.yx + vec2(19.3, 4.1) + 0.18 * t);\n\n\t// \u2500\u2500 Density curve \u2192 black negative space \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\t// Lift+gain then a gamma push so the dimmest range collapses to black and\n\t// colour blooms across the densest masses (the reference fills ~half the\n\t// frame with colour, with deep-black pockets \u2014 not a thin vein on black).\n\t// u_contrast steepens the gamma to dial how much black negative space wins.\n\tfloat dens = clamp((f - 0.20) * 2.1, 0.0, 1.0);\n\tdens = pow(dens, 0.70 * u_contrast);\n\n\t// \u2500\u2500 Palette \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\t// Ramp black \u2192 deep navy \u2192 (blue|orange) \u2192 hot, with the hue split chosen\n\t// per-pixel by hueField. A WIDE smoothstep on the boundary gives the soft,\n\t// blurred orange\u2194blue seam of the reference rather than a hard line.\n\t// Boundary centred near the field's mean (~0.5) with a wide soft band, and\n\t// shifted slightly warm so orange holds a major mass like the reference.\n\tfloat warm = smoothstep(0.30, 0.60, hueField);   // 0 = cool, 1 = warm\n\tvec3 mid = mix(u_colorA, u_colorB, warm);        // electric blue \u2194 orange\n\n\tvec3 col = u_colorBase;\n\tcol = mix(col, u_colorDeep, smoothstep(0.02, 0.30, dens));\n\tcol = mix(col, mid,         smoothstep(0.18, 0.62, dens));\n\tcol = mix(col, u_colorHot,  smoothstep(0.78, 1.00, dens) * (0.45 + 0.55 * warm));\n\n\t// Saturation/contrast lift for the electric, saturated feel of the reference.\n\tfloat lum = dot(col, vec3(0.299, 0.587, 0.114));\n\tcol = mix(vec3(lum), col, 1.20);\n\n\t// Very soft edge vignette \u2014 only the extreme corners darken, so the colour\n\t// masses still reach the centre where the heading sits (the reference keeps\n\t// colour right up to the middle).\n\tvec2 vd = (texUV - 0.5) * vec2(aspect, 1.0);\n\tfloat vig = 1.0 - smoothstep(0.75, 1.45, length(vd)) * 0.4;\n\tcol *= vig;\n\n\t// Tiny ordered-ish dither from the hash, post-tonemap, to kill banding in\n\t// the long black-to-navy ramp on 8-bit displays. Sub-LSB amplitude.\n\tfloat dith = (hash21(gl_FragCoord.xy + fract(u_time) * 57.0) - 0.5) / 255.0;\n\tcol += dith;\n\n\tcol = clamp(col, 0.0, 1.0);\n\n\tif (u_transparent > 0.5) {\n\t\t// Alpha = how far above the base black we are, so the gradient\n\t\t// composites over the page and only the blobs show.\n\t\tvec3 fg = max(col - u_colorBase, vec3(0.0));\n\t\tfloat a = clamp(max(max(fg.r, fg.g), fg.b) * 1.6, 0.0, 1.0);\n\t\toutColor = vec4(fg / max(a, 1e-4), a);   // un-premultiplied\n\t} else {\n\t\toutColor = vec4(col, 1.0);\n\t}\n}";const canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl2',{preserveDrawingBuffer:true,antialias:false});if(!gl)throw Error('WebGL2 is required');canvas.width=innerWidth;canvas.height=innerHeight;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,VERT));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,FRAG));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));gl.useProgram(p);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const a=gl.getAttribLocation(p,'a_position');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);const u=n=>gl.getUniformLocation(p,n);const f=(n,v)=>gl.uniform1f(u(n),v);const c=(n,v)=>gl.uniform3fv(u(n),v);gl.uniform2f(u('u_resolution'),canvas.width,canvas.height);gl.uniform2f(u('u_input'),.5,.5);gl.uniform2f(u('u_pointerVel'),0,0);f('u_inputActive',0);f('u_flowSpeed',3);f('u_warpAmount',1.2);f('u_scale',.85);f('u_contrast',1.05);f('u_pointerWarp',0);f('u_transparent',0);c('u_colorBase',[.008,.01,.025]);c('u_colorDeep',[.02,.02,.17]);c('u_colorA',[.13,.25,1]);c('u_colorB',[.7,.18,.85]);c('u_colorHot',[.83,.86,1]);window.film={duration:2,frame(t){gl.viewport(0,0,canvas.width,canvas.height);f('u_time',t+6);gl.drawArrays(gl.TRIANGLES,0,3);}};window.film.frame(0);
</script></body></html>
