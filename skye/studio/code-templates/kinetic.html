<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111217;color:#f5f5f7;font-family:Arial,sans-serif}main{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:clamp(32px,13vw,180px);font-weight:900;line-height:.95;letter-spacing:-.06em}small{position:absolute;top:8%;left:8%;font-size:14px;letter-spacing:.2em;color:#a1a1aa}.accent{color:#a7d9e2}</style></head><body><small>CODE SHOT / CSS + JS</small><main><div id="a">MAKE</div><div id="b" class="accent">IT MOVE.</div></main><script>window.film={duration:2,frame(t){for(const [i,id] of ['a','b'].entries()){const u=Math.max(0,Math.min(1,(t-i*.15)/.6));const ease=1-Math.pow(1-u,3);const el=document.getElementById(id);el.style.opacity=String(ease);el.style.transform='translateY('+((1-ease)*100)+'px) scale('+(0.85+.15*ease)+')';}}};window.film.frame(0);</script></body></html>
