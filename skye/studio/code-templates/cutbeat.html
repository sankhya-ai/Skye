<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111313;color:#b8ffdf;font-family:Arial,Helvetica,sans-serif}#media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#shade{position:absolute;inset:0;background:linear-gradient(#0009,#0001 60%,#0007)}#grid{position:absolute;inset:-8%;display:grid;grid-template-columns:repeat(3,1fr);gap:3vw;transform:rotate(-10deg)}.tile{border:1px solid #ffffff30;border-radius:4vw;background:linear-gradient(145deg,#526f68,#172621);display:flex;align-items:center;justify-content:center;font-size:8vw;font-weight:900;letter-spacing:-.05em;color:#ffffff60;height:38vh}.tile:nth-child(3n+1){background:linear-gradient(145deg,#8c5657,#281b22)}.tile:nth-child(3n+2){background:linear-gradient(145deg,#59689d,#182132)}#words{position:absolute;inset:0;padding:10vh 7vw;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;line-height:.86;letter-spacing:-.065em;font-weight:900}#words.top{justify-content:flex-start;padding-top:15vh}#words.bottom{justify-content:flex-end;padding-bottom:16vh}.word{font-size:19vw;white-space:nowrap;transform-origin:left center}#label{position:absolute;left:8vw;bottom:7vh;font-size:3vw;letter-spacing:.2em;font-weight:700}#line{position:absolute;left:8vw;right:8vw;top:8vh;height:2px;background:currentColor;opacity:.5}#screen{position:absolute;width:92%;height:44%;left:4%;top:45%;object-fit:contain;filter:drop-shadow(0 2vw 3vw #0008)}#flash{position:absolute;inset:0;background:#f4f3eb;pointer-events:none}
</style></head><body><div id="grid"></div><div id="shade"></div><div id="line"></div><div id="words"></div><div id="label"></div><div id="flash"></div><script>
const CONFIG={words:['MAKE','THE CUT.'],media:'',image:'',sourceIn:0,layout:'center',paper:false,grid:false,label:'SKYE',size:19};
const words=document.getElementById('words');words.className=CONFIG.layout;CONFIG.words.forEach(word=>{const el=document.createElement('div');el.className='word';el.textContent=word;el.style.fontSize=CONFIG.size+'vw';words.append(el);const px=window.innerWidth*CONFIG.size/100;el.style.fontSize=Math.min(px,px*window.innerWidth*.84/Math.max(1,el.scrollWidth))+'px'});document.getElementById('label').textContent=CONFIG.label;document.getElementById('grid').innerHTML=CONFIG.grid?['SHOOT','PLAY','CUT','01','SAVE','02','STORY','03','GO'].map(t=>'<div class="tile">'+t+'</div>').join(''):'';
let video;if(CONFIG.media){video=document.createElement('video');video.id='media';video.src=CONFIG.media;video.muted=true;video.preload='auto';video.playsInline=true;document.body.prepend(video)}
if(CONFIG.image){const image=document.createElement('img');image.id='screen';image.src=CONFIG.image;document.body.insertBefore(image,document.getElementById('words'));}
if(CONFIG.paper){document.body.style.background='#f2f0e9';document.body.style.color='#e13b43';document.getElementById('shade').style.display='none'}
if(!CONFIG.media&&!CONFIG.grid)document.getElementById('shade').style.display='none';
async function seek(t){if(!video)return;if(video.readyState<1)await new Promise((ok,no)=>{video.addEventListener('loadedmetadata',ok,{once:true});video.addEventListener('error',()=>no(Error('Video unavailable')),{once:true})});const target=Math.min(video.duration-.04,CONFIG.sourceIn+t);if(Math.abs(video.currentTime-target)<.008&&video.readyState>=2)return;await new Promise((ok,no)=>{const timer=setTimeout(()=>no(Error('Video seek timed out')),8000);video.addEventListener('seeked',()=>{clearTimeout(timer);ok()},{once:true});video.currentTime=target;});}
window.film={duration:2,async frame(t){await seek(t);for(const [i,el]of [...words.children].entries()){const u=Math.max(0,Math.min(1,(t-i*.11)/.34)),e=1-Math.pow(1-u,3);el.style.opacity=e;el.style.transform='translateY('+((1-e)*70)+'px) rotate('+((1-e)*-7)+'deg) scale('+(1.18-.18*e)+')';}document.getElementById('grid').style.translate='0 '+(-t*9)+'vh';document.getElementById('flash').style.opacity=String(Math.max(0,1-t/.055));if(video)video.style.transform='scale('+(1.02+t*.035)+')';}};
</script></body></html>
